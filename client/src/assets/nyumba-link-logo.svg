<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- House icon -->
  <g transform="translate(5, 15)">
    <!-- House base -->
    <polygon points="15,25 35,25 35,35 25,35 25,45 15,35" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
    <!-- Roof -->
    <polygon points="10,25 25,10 40,25" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
    <!-- Door -->
    <rect x="22" y="30" width="6" height="10" fill="#1f2937" rx="1"/>
    <!-- Door knob -->
    <circle cx="27" cy="35" r="1" fill="#fbbf24"/>
    <!-- Windows -->
    <rect x="17" y="27" width="3" height="3" fill="#3b82f6" rx="0.5"/>
    <rect x="30" y="27" width="3" height="3" fill="#3b82f6" rx="0.5"/>
  </g>

  <!-- Text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Nyumba</text>
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">Link</text>

  <!-- Link symbol -->
  <g transform="translate(140, 20)">
    <circle cx="5" cy="5" r="3" fill="none" stroke="#16a34a" stroke-width="2"/>
    <circle cx="15" cy="5" r="3" fill="none" stroke="#16a34a" stroke-width="2"/>
    <path d="M8,5 L12,5" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>