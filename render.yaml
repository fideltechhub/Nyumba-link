services:
  - type: web
    name: nyumba-link-server
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nyumba-link-postgres
          property: connectionString
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://nyumba-link-client.onrender.com

  - type: web
    name: nyumba-link-client
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://nyumba-link-server.onrender.com

databases:
  - name: nyumba-link-postgres
    ipAllowList: []
